[package]
name = "backuppilot-tauri"
description = "BackupPilot desktop application (Tauri/Svelte) for Windows and macOS"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "backuppilot_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "backuppilot-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
serde.workspace = true
serde_json.workspace = true
backuppilot-ipc = { path = "../backuppilot-ipc" }
backuppilot-core = { path = "../backuppilot-core" }
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-subscriber.workspace = true
