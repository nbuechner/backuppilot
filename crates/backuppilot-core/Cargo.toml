[package]
name = "backuppilot-core"
description = "Shared models, database and PBS client integration for BackupPilot"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
directories = "5"
chrono.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
croner = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Windows Credential Manager — replaces secret-tool on Windows.
keyring = "3"
# WinRT toast notifications — replaces notify-send on Windows.
notify-rust = { version = "4", default-features = false }
