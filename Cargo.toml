[workspace]
resolver = "2"
members = [
    "crates/backuppilot-core",
    "crates/backuppilot-cli",
    "crates/backuppilot-daemon",
    "crates/backuppilot-gui",
    "crates/backuppilot-i18n",
    "crates/backuppilot-ipc",
    "crates/backuppilot-tauri",
    "crates/backuppilot-probe",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["BackupPilot Contributors"]
repository = "https://git.onesystems.ch/backuppilot"
rust-version = "1.78"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "time", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
