name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  # ── Windows: NSIS installer ──────────────────────────────────────────────────
  build-windows:
    name: Windows installer (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: crates/backuppilot-tauri/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: crates/backuppilot-tauri/ui
        run: npm ci

      - name: Build frontend
        working-directory: crates/backuppilot-tauri/ui
        run: npm run build

      - name: Build daemon (must exist before Tauri bundles resources)
        run: cargo build -p backuppilot-daemon --release

      - name: Build Tauri app + NSIS installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/backuppilot-tauri
          args: --bundles nsis

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: backuppilot-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ── Linux: .deb packages ─────────────────────────────────────────────────────
  # ubuntu-24.04: Tauri (WebKitGTK) build — runs on GTK 4.14 / libadwaita 1.4
  # ubuntu-26.04: GTK native build — requires GTK 4.16+ / libadwaita 1.6+
  build-linux:
    name: Linux .deb (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            suffix: ubuntu2404
            ui: tauri
            gui_bin: backuppilot-tauri
            depends: "proxmox-backup-client, fuse3, libwebkit2gtk-4.1-0"
          - runner: ubuntu-26.04
            suffix: ubuntu2604
            ui: gtk
            gui_bin: backuppilot
            depends: "proxmox-backup-client, fuse3, libadwaita-1-0 (>= 1.6)"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install system dependencies (Tauri / ubuntu-24.04)
        if: matrix.ui == 'tauri'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            pkg-config \
            libssl-dev

      - name: Install system dependencies (GTK / ubuntu-26.04)
        if: matrix.ui == 'gtk'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libdbus-1-dev \
            pkg-config \
            libssl-dev

      - name: Set up Node (Tauri only)
        if: matrix.ui == 'tauri'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: crates/backuppilot-tauri/ui/package-lock.json

      - name: Install frontend dependencies (Tauri only)
        if: matrix.ui == 'tauri'
        working-directory: crates/backuppilot-tauri/ui
        run: npm ci

      - name: Build frontend (Tauri only)
        if: matrix.ui == 'tauri'
        working-directory: crates/backuppilot-tauri/ui
        run: npm run build

      - name: Build binaries (Tauri)
        if: matrix.ui == 'tauri'
        run: cargo build -p backuppilot-daemon -p backuppilot-cli -p backuppilot-tauri --release

      - name: Build binaries (GTK)
        if: matrix.ui == 'gtk'
        run: cargo build -p backuppilot-daemon -p backuppilot-gui -p backuppilot-cli --release

      - name: Package as .deb
        run: |
          set -e
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          PKG="backuppilot_${VERSION}_${{ matrix.suffix }}_amd64"

          mkdir -p "$PKG/DEBIAN"
          mkdir -p "$PKG/usr/bin"
          mkdir -p "$PKG/usr/lib/systemd/user"
          mkdir -p "$PKG/usr/share/applications"
          mkdir -p "$PKG/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "$PKG/usr/share/icons/hicolor/512x512/apps"

          cp target/release/${{ matrix.gui_bin }} "$PKG/usr/bin/backuppilot"
          cp target/release/backuppilot-daemon    "$PKG/usr/bin/"
          cp target/release/backuppilot-cli       "$PKG/usr/bin/"
          cp data/backuppilot-daemon.service      "$PKG/usr/lib/systemd/user/"
          cp data/ch.onesystems.backuppilot.desktop "$PKG/usr/share/applications/"
          cp data/icons/hicolor/256x256/apps/ch.onesystems.backuppilot.png \
             "$PKG/usr/share/icons/hicolor/256x256/apps/"
          cp data/icons/hicolor/512x512/apps/ch.onesystems.backuppilot.png \
             "$PKG/usr/share/icons/hicolor/512x512/apps/"

          printf 'Package: backuppilot\nVersion: %s\nArchitecture: amd64\nMaintainer: BackupPilot Contributors <noreply@buechner.me>\nDepends: ${{ matrix.depends }}\nDescription: BackupPilot - Proxmox Backup Server GUI client\n Provides scheduled backups, restore, snapshot browsing, and\n read-only FUSE mounts of PBS archives.\n' "$VERSION" > "$PKG/DEBIAN/control"

          printf '#!/bin/sh\nset -e\nsystemctl --user daemon-reload 2>/dev/null || true\nsystemctl --user enable backuppilot-daemon.service 2>/dev/null || true\nsystemctl --user start backuppilot-daemon.service 2>/dev/null || true\n' > "$PKG/DEBIAN/postinst"
          chmod 755 "$PKG/DEBIAN/postinst"

          printf '#!/bin/sh\nset -e\nsystemctl --user stop backuppilot-daemon.service 2>/dev/null || true\nsystemctl --user disable backuppilot-daemon.service 2>/dev/null || true\n' > "$PKG/DEBIAN/prerm"
          chmod 755 "$PKG/DEBIAN/prerm"

          dpkg-deb --build "$PKG"

      - name: Upload .deb package
        uses: actions/upload-artifact@v4
        with:
          name: backuppilot-linux-deb-${{ matrix.suffix }}
          path: "*.deb"
          if-no-files-found: error

  # ── Release: attach artifacts on version tags ────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: backuppilot-windows-installer
          path: dist/

      - name: Download Linux .deb (ubuntu-24.04 / Tauri)
        uses: actions/download-artifact@v4
        with:
          name: backuppilot-linux-deb-ubuntu2404
          path: dist/

      - name: Download Linux .deb (ubuntu-26.04 / GTK)
        uses: actions/download-artifact@v4
        with:
          name: backuppilot-linux-deb-ubuntu2604
          path: dist/

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
