name: Build & Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  # ── Windows: NSIS installer ──────────────────────────────────────────────────
  build-windows:
    name: Windows installer (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: crates/backuppilot-tauri/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: crates/backuppilot-tauri/ui
        run: npm ci

      - name: Build frontend
        working-directory: crates/backuppilot-tauri/ui
        run: npm run build

      - name: Build daemon (must exist before Tauri bundles resources)
        run: cargo build -p backuppilot-daemon --release

      - name: Build Tauri app + NSIS installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/backuppilot-tauri
          args: --bundles nsis

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: backuppilot-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ── Linux ubuntu-24.04: Tauri / WebKitGTK ───────────────────────────────────
  build-linux-tauri:
    name: Linux .deb (ubuntu-24.04 / Tauri)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            pkg-config \
            libssl-dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: crates/backuppilot-tauri/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: crates/backuppilot-tauri/ui
        run: npm ci

      - name: Build frontend
        working-directory: crates/backuppilot-tauri/ui
        run: npm run build

      - name: Build binaries
        run: cargo build -p backuppilot-daemon -p backuppilot-cli -p backuppilot-tauri --release

      - name: Package as .deb
        run: |
          set -e
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          PKG="backuppilot_${VERSION}_ubuntu2404_amd64"

          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin" "$PKG/usr/lib/systemd/user" \
                   "$PKG/usr/share/applications" \
                   "$PKG/usr/share/icons/hicolor/256x256/apps" \
                   "$PKG/usr/share/icons/hicolor/512x512/apps"

          cp target/release/backuppilot-tauri  "$PKG/usr/bin/backuppilot"
          cp target/release/backuppilot-daemon "$PKG/usr/bin/"
          cp target/release/backuppilot-cli    "$PKG/usr/bin/"
          cp data/backuppilot-daemon.service   "$PKG/usr/lib/systemd/user/"
          cp data/ch.onesystems.backuppilot.desktop "$PKG/usr/share/applications/"
          cp data/icons/hicolor/256x256/apps/ch.onesystems.backuppilot.png \
             "$PKG/usr/share/icons/hicolor/256x256/apps/"
          cp data/icons/hicolor/512x512/apps/ch.onesystems.backuppilot.png \
             "$PKG/usr/share/icons/hicolor/512x512/apps/"

          printf 'Package: backuppilot\nVersion: %s\nArchitecture: amd64\nMaintainer: BackupPilot Contributors <noreply@buechner.me>\nDepends: fuse3, libwebkit2gtk-4.1-0\nRecommends: proxmox-backup-client\nDescription: BackupPilot - Proxmox Backup Server GUI client\n Provides scheduled backups, restore, snapshot browsing, and\n read-only FUSE mounts of PBS archives.\n' "$VERSION" > "$PKG/DEBIAN/control"
          printf '#!/bin/sh\nset -e\nsystemctl --user daemon-reload 2>/dev/null || true\nsystemctl --user enable backuppilot-daemon.service 2>/dev/null || true\nsystemctl --user start backuppilot-daemon.service 2>/dev/null || true\n' > "$PKG/DEBIAN/postinst"
          chmod 755 "$PKG/DEBIAN/postinst"
          printf '#!/bin/sh\nset -e\nsystemctl --user stop backuppilot-daemon.service 2>/dev/null || true\nsystemctl --user disable backuppilot-daemon.service 2>/dev/null || true\n' > "$PKG/DEBIAN/prerm"
          chmod 755 "$PKG/DEBIAN/prerm"

          dpkg-deb --build "$PKG"

      - name: Upload .deb package
        uses: actions/upload-artifact@v4
        with:
          name: backuppilot-linux-deb-ubuntu2404
          path: "*.deb"
          if-no-files-found: error

  # ── Linux ubuntu-26.04: GTK native (runs inside ubuntu:26.04 container) ─────
  build-linux-gtk:
    name: Linux .deb (ubuntu-26.04 / GTK)
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - name: Install prerequisites
        run: apt-get update && apt-get install -y git curl

      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install system dependencies
        run: |
          apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libdbus-1-dev \
            pkg-config \
            libssl-dev \
            build-essential

      - name: Build binaries
        run: cargo build -p backuppilot-daemon -p backuppilot-gui -p backuppilot-cli --release

      - name: Package as .deb
        run: |
          set -e
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          PKG="backuppilot_${VERSION}_ubuntu2604_amd64"

          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin" "$PKG/usr/lib/systemd/user" \
                   "$PKG/usr/share/applications" \
                   "$PKG/usr/share/icons/hicolor/256x256/apps" \
                   "$PKG/usr/share/icons/hicolor/512x512/apps"

          cp target/release/backuppilot        "$PKG/usr/bin/"
          cp target/release/backuppilot-daemon "$PKG/usr/bin/"
          cp target/release/backuppilot-cli    "$PKG/usr/bin/"
          cp data/backuppilot-daemon.service   "$PKG/usr/lib/systemd/user/"
          cp data/ch.onesystems.backuppilot.desktop "$PKG/usr/share/applications/"
          cp data/icons/hicolor/256x256/apps/ch.onesystems.backuppilot.png \
             "$PKG/usr/share/icons/hicolor/256x256/apps/"
          cp data/icons/hicolor/512x512/apps/ch.onesystems.backuppilot.png \
             "$PKG/usr/share/icons/hicolor/512x512/apps/"

          printf 'Package: backuppilot\nVersion: %s\nArchitecture: amd64\nMaintainer: BackupPilot Contributors <noreply@buechner.me>\nDepends: fuse3, libadwaita-1-0 (>= 1.6)\nRecommends: proxmox-backup-client\nDescription: BackupPilot - Proxmox Backup Server GUI client\n Provides scheduled backups, restore, snapshot browsing, and\n read-only FUSE mounts of PBS archives.\n' "$VERSION" > "$PKG/DEBIAN/control"
          printf '#!/bin/sh\nset -e\nsystemctl --user daemon-reload 2>/dev/null || true\nsystemctl --user enable backuppilot-daemon.service 2>/dev/null || true\nsystemctl --user start backuppilot-daemon.service 2>/dev/null || true\n' > "$PKG/DEBIAN/postinst"
          chmod 755 "$PKG/DEBIAN/postinst"
          printf '#!/bin/sh\nset -e\nsystemctl --user stop backuppilot-daemon.service 2>/dev/null || true\nsystemctl --user disable backuppilot-daemon.service 2>/dev/null || true\n' > "$PKG/DEBIAN/prerm"
          chmod 755 "$PKG/DEBIAN/prerm"

          dpkg-deb --build "$PKG"

      - name: Upload .deb package
        uses: actions/upload-artifact@v4
        with:
          name: backuppilot-linux-deb-ubuntu2604
          path: "*.deb"
          if-no-files-found: error

  # ── Release: attach artifacts on version tags ────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux-tauri, build-linux-gtk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: backuppilot-windows-installer
          path: dist/

      - name: Download Linux .deb (ubuntu-24.04 / Tauri)
        uses: actions/download-artifact@v4
        with:
          name: backuppilot-linux-deb-ubuntu2404
          path: dist/

      - name: Download Linux .deb (ubuntu-26.04 / GTK)
        uses: actions/download-artifact@v4
        with:
          name: backuppilot-linux-deb-ubuntu2604
          path: dist/

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
